server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:inspecoespci-pb;DB_CLOSE_DELAY=-1
    username: sa
    password: 123456
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  application:
    name: inspecoespci-pb
